<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulateur de Panier</title>
  
<body>

  <div class="container">
    <h1>Simulateur de Panier de courses</h1>

    <div class="product">
      <span>soutien - 500FCFA</span>
      <button onclick="addToCart('soutien', 500)">Ajouter</button>
    </div>
    <div class="product">
      <span>jupe - 5750FCFA</span>
      <button onclick="addToCart('jupe', 5750)">Ajouter</button>
    </div>
    <div class="product">
      <span>telephone - 50000FCFA</span>
      <button onclick="addToCart('telephone', 50000)">Ajouter</button>
    </div>
    <div class="product">
      <span>ordinateur - 150000FCFA</span>
      <button onclick="addToCart('ordinateur' , 150000)">Ajouter</button>
    </div>

    <h2>Mon panier :</h2>
    <ul id="cart"></ul>
    <div id="total">Total : 0FCFA</div>
  </div>
</body>
<style>
body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1, h2 {
      color: #2c3e50;
    }
    .container{
      max-width: 600px;
      margin: 0 auto;
      background: #a18f8fd7;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .product:last-child {
      border-bottom: none;
    }

    button {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #27ae60;
    }

    ul#cart {
      list-style-type: none;
      padding: 0;
    }

    ul#cart li {
      padding: 6px 0;
      border-bottom: 1px dashed #ccc;
    }

    #total {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
      color: #a0163d;
    }
  </style>
</head>
  <script>
    let total = 0;
    const cart = [];

    function addToCart(product, price) {
      cart.push({ product, price });
      total += price;
      updateCart();
    }

    function updateCart() {
      const cartList = document.getElementById('cart');
      cartList.innerHTML = "";
      cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.product} - ${item.price.toFixed(2)}FCFA`;
        cartList.appendChild(li);
      });
      document.getElementById('total').textContent = `Total : ${total.toFixed(2)}FCFA`;
    }
  </script>

</body>
</html>
